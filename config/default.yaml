# TwinBrain Default Training Configuration
# This configuration represents the improved v4 training parameters

version: "v4"
description: "Improved training with stronger temporal alignment and deeper decoder"

# Random seed for reproducibility
random_seed: 42

# Training parameters
training:
  # Warmup stage: freeze scale parameters for stable initialization
  warmup_epochs: 3  # Number of epochs to freeze scale parameters (reduced for memory efficiency)
  warmup_learning_rate: 0.00005  # Lower LR during warmup for stability
  
  # Main training stage: primary training with default loss weights
  main_epochs: 60  # Main training phase (previously embedded in warmup_run_epochs + part of finetune)
  
  # Fine-tuning stage: refine with stronger temporal alignment
  finetune_epochs: 30  # Fine-tuning with increased temp_weight (reduced from 80)
  finetune_temp_weight: 5.0  # Increased temporal weight for fine-tuning
  
  # General training settings
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_accumulation_steps: 1  # Accumulate gradients over N steps (1=no accumulation)
  clear_cache_frequency: 1  # Clear CUDA cache every N batches (1=every batch, higher=less frequent)
  
  # Learning rate multipliers
  feature_lr_mul: 12.0
  scale_lr_mul: 10.0
  
  # Scheduler
  scheduler:
    type: "StepLR"
    step_size: 30
    gamma: 0.7

# Model architecture
model:
  hidden_dim: 96  # Reduced from 128 for better memory efficiency on 8GB GPUs
  num_layers: 2
  decoder_layers: 3  # Deeper decoder than v3
  dropout: 0.1
  
  # Encoder settings
  encoder:
    use_batch_norm: true
    activation: "relu"
  
  # Decoder settings
  decoder:
    use_residual: true
    activation: "relu"

# Loss function weights
loss:
  recon_weight: 1.0
  recon_norm_weight: 3.0
  recon_corr_weight: 2.0
  recon_feat_var_weight: 0.02
  temp_weight: 2.0  # Default temporal weight for warmup and main training (was 5.0)
  # Note: temp_weight is increased during fine-tuning stage (see training.finetune_temp_weight)

# Prediction settings (NEW)
prediction:
  enabled: false  # Enable multi-step future prediction
  context_length: 50  # Number of historical steps to use as context (limits memory usage)
  steps: 10  # Number of future steps to predict
  weight: 0.1  # Weight for prediction loss
  use_gradient_checkpointing: true  # Use gradient checkpointing to save memory (recommended)
  # Example: Use last 50 steps to predict next 10 steps

# Dynamic Variability Weighting (NEW)
# Implements learnability-based dynamic weighting to prevent EEG collapse and emphasize fMRI state transitions
dynamic_weighting:
  enabled: false  # Enable dynamic variability-based weighting
  
  # Variability computation parameters
  eeg_window_size: 50  # Sliding window for EEG variability (fast time scale)
  fmri_window_size: 150  # Sliding window for fMRI variability (slow time scale, 3x EEG)
  
  # Weight mapping parameters
  min_weight: 0.01  # Minimum weight to prevent complete suppression of channels
  
  # Training stage scheduling (temperatures control weight sharpness)
  # Note: warmup_epochs, main_epochs, finetune_epochs are taken from the
  # training section above by default (lines 13, 17, 20)
  warmup_temp: 0.1  # Small temperature = sharp focus on high-variability channels
  main_temp_start: 0.1  # Starting temperature for main training
  main_temp_end: 1.0  # Ending temperature for main training (gradual broadening)
  finetune_temp: 2.0  # Large temperature = flat distribution to prevent overfitting
  disable_in_finetune: false  # If true, use uniform weights in finetune stage
  
  # Modality-specific options
  eeg_use_first_order_diff: true  # Use first-order difference energy for EEG
  eeg_use_covariance: false  # Use channel covariance participation (expensive)
  fmri_use_fc_change: true  # Use functional connectivity changes for fMRI
  
  # When enabled:
  # - Warmup: Focus on high-variability channels (prevent collapse)
  # - Main: Gradually include more channels as training progresses
  # - Finetune: Broaden or disable to prevent overfitting to local patterns
  
# Auto-alignment settings
alignment:
  auto_align: true
  auto_align_max_lag: 150
  
# Data processing
data:
  use_cache: true
  cache_dir: "cache"
  
  # Atlas settings
  atlas:
    name: "Schaefer200"
    n_parcels: 200
    networks: 7

# Diagnostics and logging
diagnostics:
  enabled: true
  save_plots: true
  diagnostic_dir: "diagnostics"
  plot_nodes: [0, 1, 2]

# Metrics tracking (NEW)
metrics:
  enabled: true  # Enable enhanced metrics tracking
  output_dir: "metrics"  # Directory to save metrics
  
# Output settings
output:
  save_checkpoints: true
  checkpoint_interval: 20  # Save every N epochs
  save_final_model: true
  results_dir: "results"

# Memory optimization (NEW) - Critical for GPUs with limited memory
memory:
  # GPU memory optimization settings
  optimize_for_low_memory: true  # Enable memory-efficient training mode
  
  # CUDA memory management
  enable_empty_cache: true  # Clear CUDA cache periodically
  cache_clear_frequency: 1  # Clear cache every N batches (1=every batch)
  
  # Gradient checkpointing
  use_gradient_checkpointing: true  # Enable gradient checkpointing for GRU/attention
  
  # Tips for 8GB GPU:
  # - Keep hidden_dim <= 96
  # - Set prediction.context_length <= 50
  # - Enable gradient_checkpointing
  # - Set clear_cache_frequency = 1
