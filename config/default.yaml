# TwinBrain Default Training Configuration
# This configuration represents the improved v4 training parameters

version: "v4"
description: "Improved training with stronger temporal alignment and deeper decoder"

# Training parameters
training:
  warmup_epochs: 5
  warmup_run_epochs: 15  # warmup_epochs + 10
  finetune_epochs: 80
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  
  # Learning rate multipliers
  feature_lr_mul: 12.0
  scale_lr_mul: 10.0
  
  # Scheduler
  scheduler:
    type: "StepLR"
    step_size: 30
    gamma: 0.7

# Model architecture
model:
  hidden_dim: 128
  num_layers: 2
  decoder_layers: 3  # Deeper decoder than v3
  dropout: 0.1
  
  # Encoder settings
  encoder:
    use_batch_norm: true
    activation: "relu"
  
  # Decoder settings
  decoder:
    use_residual: true
    activation: "relu"

# Loss function weights
loss:
  recon_weight: 1.0
  recon_norm_weight: 3.0
  recon_corr_weight: 2.0
  recon_feat_var_weight: 0.02
  temp_weight: 5.0  # Stronger temporal alignment than v3 (was 1.0)

# Prediction settings (NEW)
prediction:
  enabled: false  # Enable multi-step future prediction
  steps: 10  # Number of future steps to predict
  weight: 0.1  # Weight for prediction loss
  
# Auto-alignment settings
alignment:
  auto_align: true
  auto_align_max_lag: 150
  
# Data processing
data:
  use_cache: true
  cache_dir: "cache"
  
  # Atlas settings
  atlas:
    name: "Schaefer200"
    n_parcels: 200
    networks: 7

# Diagnostics and logging
diagnostics:
  enabled: true
  save_plots: true
  diagnostic_dir: "diagnostics"
  plot_nodes: [0, 1, 2]

# Metrics tracking (NEW)
metrics:
  enabled: true  # Enable enhanced metrics tracking
  output_dir: "metrics"  # Directory to save metrics
  
# Output settings
output:
  save_checkpoints: true
  checkpoint_interval: 20  # Save every N epochs
  save_final_model: true
  results_dir: "results"
